name: Inspect approved Cleaneye API schema
on:
  push:
    branches: [codex/cleaneye-api-20261107]
    paths:
      - scripts/probe_cleaneye_api.py
      - .github/workflows/cleaneye-api-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read region codes and one approved employment response
        env:
          CLEANEYE_KEY: ${{ secrets.CLEANEYE_KEY || secrets.DATA_GO_KR_KEY }}
        run: python scripts/probe_cleaneye_api.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cleaneye-api-probe-${{ github.run_id }}
          path: cleaneye-api-probe-output/
          retention-days: 14
