name: ALIO isolated live contract check
on:
  push:
    branches: [codex/restore-careerpick-20261103]
    paths:
      - alio.py
      - scripts/verify_alio_live.py
      - test_alio_new_contract.py
      - .github/workflows/alio-live-check.yml
permissions:
  contents: read
jobs:
  live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest test_alio_new_contract
      - run: python -m unittest discover -s tests -p '*collection*.py'
      - run: python test_alio_partial_fetch.py
      - name: Verify live API into isolated candidate
        env:
          ALIO_KEY: ${{ secrets.ALIO_KEY }}
        run: python scripts/verify_alio_live.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alio-isolated-live-check
          path: live-check-output/
          retention-days: 3

