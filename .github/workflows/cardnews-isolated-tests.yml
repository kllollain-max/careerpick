# Cardnews isolated verification (not scheduled, not publishing)
# Workflow only available on the isolated development branch until separately approved.
name: Cardnews isolated tests
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/cardnews/**'
      - '.github/workflows/cardnews-isolated-tests.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline renderer dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install -r tools/cardnews/requirements.txt
      - name: Run isolated tests
        run: |
          cd tools/cardnews
          python -m unittest discover -s . -p 'test_*.py' -v
      - name: Verify no publication integration
        run: |
          test ! -e tools/cardnews/.env
          echo 'Offline-only cardnews verification complete'
