name: Content mobile readability check
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  content-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile embedded operations reporting Python without API calls
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/operations.yml').read_text()
          marker = '      - name: Record unchanged or deployment result'
          section = workflow.split(marker, 1)[1]
          embedded = section.split("          python - <<'PY'", 1)[1].split('          PY', 1)[0]
          compile(textwrap.dedent(embedded), 'operations-reporting-embedded.py', 'exec')
          print('Embedded source-health reporting Python syntax valid')
          PY
      - run: python scripts/build_public_site.py
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node .github/scripts/check-content-mobile.cjs careerpick
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: content-mobile-evidence
          path: mobile-evidence/
          retention-days: 7
