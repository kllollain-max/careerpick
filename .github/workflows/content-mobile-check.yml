name: Content mobile readability check
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  content-mobile:
    runs-on: ubuntu-24.04
    # Browser checks cover every reviewed page at three widths. Allow bounded
    # apt mirror retries and full screenshot evidence without killing the job.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile embedded operations reporting Python without API calls
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/operations.yml').read_text()
          marker = '      - name: Record unchanged or deployment result'
          section = workflow.split(marker, 1)[1]
          embedded = section.split("          python - <<'PY'", 1)[1].split('          PY', 1)[0]
          compile(textwrap.dedent(embedded), 'operations-reporting-embedded.py', 'exec')
          print('Embedded source-health reporting Python syntax valid')
          PY
      - name: Test source-health annotations with offline fixtures
        run: python -m unittest discover -s tests -p 'test_source_health_reporting.py' -v
      - name: Test GOJOBS transport error classification without network calls
        run: python -m unittest discover -s tests -p 'test_gojobs_transport_diagnostics.py' -v
      - run: python -m unittest discover -s tests -p test_naver_analytics_build.py
      - run: python scripts/build_public_site.py
      - run: npm install --no-save playwright@1.56.1
      # Ubuntu mirrors occasionally return HTTP 503 during Playwright apt dependencies.
      # APT retries transient download failures; genuine failures still fail CI.
      - name: Configure bounded APT retries for Chromium dependencies
        run: |
          printf 'Acquire::Retries "3";\n' | sudo tee /etc/apt/apt.conf.d/80-playwright-retries >/dev/null
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/naver_analytics_browser.cjs
      - run: node .github/scripts/check-content-mobile.cjs careerpick
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: content-mobile-evidence
          path: mobile-evidence/
          retention-days: 7
