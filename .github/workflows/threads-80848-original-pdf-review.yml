name: Independently obtain exact SeoulMetro Environment 2026-17 employer original PDF
on:
  push:
    branches:
      - verify/threads-80848-live-check-20261117
    paths:
      - .github/workflows/threads-80848-original-pdf-review.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original_pdf:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet requests beautifulsoup4 pypdf
      - name: Get exactly pinned employer notice and its first attachment
        env:
          PYTHONUNBUFFERED: '1'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p official-evidence-80848
          python - <<'PY'
          import requests,bs4,urllib.parse,hashlib,json,re,pathlib,datetime
          from pypdf import PdfReader
          source='https://cleanmetro.co.kr/bbs/board.php?bo_table=recruit&wr_id=430'
          session=requests.Session()
          session.headers.update({'User-Agent':'Mozilla/5.0 (compatible; CareerPickIndependentReview/1.0)','Accept-Language':'ko-KR,ko;q=0.9'})
          html=session.get(source,timeout=25)
          html.raise_for_status()
          page=html.content.decode(html.apparent_encoding or 'utf-8',errors='replace')
          if '2026-17' not in page or '공무·경비직' not in page:
              raise SystemExit('EXACT_EMPLOYER_NOTICE_NOT_VERIFIED')
          soup=bs4.BeautifulSoup(html.content,'html.parser')
          links=[]
          for a in soup.select('a[href]'):
              href=urllib.parse.urljoin(source,a['href'])
              u=urllib.parse.urlsplit(href)
              q=urllib.parse.parse_qs(u.query)
              if u.hostname=='cleanmetro.co.kr' and u.path=='/bbs/download.php' and q.get('bo_table')==['recruit'] and q.get('wr_id')==['430'] and q.get('no')==['11']:
                  links.append((href,a.get_text(' ',strip=True)))
          if len(links)!=1: raise SystemExit('EXACT_ATTACHMENT_LINK_NOT_UNIQUE_'+str(len(links)))
          url,title=links[0]
          if '2026-17' not in title: raise SystemExit('ATTACHMENT_TITLE_MISMATCH_'+title)
          response=session.get(url,headers={'Referer':source},timeout=30)
          response.raise_for_status()
          data=response.content
          if not data.startswith(b'%PDF-') or not 10000<=len(data)<=10000000:
              raise SystemExit('EMPLOYER_ATTACHMENT_NOT_PDF')
          path=pathlib.Path('official-evidence-80848/2026-17-original.pdf')
          path.write_bytes(data)
          pdf=PdfReader(path)
          page_text='\\n'.join(p.extract_text() or '' for p in pdf.pages)
          if not ('103' in page_text and ('공무직' in page_text or '공무 직' in page_text) and ('153' in page_text)):
              raise SystemExit('UNIT_TABLE_NOT_READABLE_IN_ORIGINAL_PDF')
          report={'source_notice_url':source,'attachment_title':title,'original_sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data),'pages':len(pdf.pages),'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'unit_103_found':True,'whole_153_found':True,'text_excerpt':page_text[:4500], 'meta_posted':False, 'queue_updated':False}
          pathlib.Path('official-evidence-80848/receipt.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\\n')
          print('EMPLOYER_ORIGINAL_PDF_RECEIPT='+json.dumps(report,ensure_ascii=False)[:1600])
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-employer-2026-17-original
          path: official-evidence-80848/
          retention-days: 7
