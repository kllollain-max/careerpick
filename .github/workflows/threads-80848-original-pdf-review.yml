name: Independently obtain exact SeoulMetro Environment 2026-17 employer original PDF
on:
  push:
    branches:
      - verify/threads-80848-live-check-20261117
    paths:
      - .github/workflows/threads-80848-original-pdf-review.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original_pdf:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated real Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Follow exact employer-issued original PDF from live notice, no writes
        shell: bash
        run: |
          mkdir -p official-evidence-80848
          node - <<'NODE'
          const {chromium}=require('playwright');
          const fs=require('fs'),crypto=require('crypto');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              const context=await browser.newContext({acceptDownloads:true,locale:'ko-KR'});
              const page=await context.newPage();
              const url='https://cleanmetro.co.kr/bbs/board.php?bo_table=recruit&wr_id=430';
              await page.goto(url,{waitUntil:'domcontentloaded',timeout:50000});
              try{await page.waitForFunction(()=>document.body.innerText.includes('2026-17'),null,{timeout:22000})}
              catch(e){console.log('EMPLOYER_BOARD_CHALLENGE='+JSON.stringify({url:page.url(),html:(await page.content()).slice(0,750)}));throw e}
              const found=await page.locator('a[href]').evaluateAll(els=>els.map(a=>({url:a.href,text:a.innerText})).filter(x=>x.url.includes('download.php')&&x.url.includes('wr_id=430')&&x.url.includes('no=11')));
              if(found.length!==1||!found[0].text.includes('2026-17'))throw new Error('EXACT_ORIGINAL_LINK_NOT_UNIQUE');
              await page.screenshot({path:'official-evidence-80848/official-board.png'});
              const [download]=await Promise.all([page.waitForEvent('download',{timeout:40000}),page.locator('a[href*="download.php"][href*="no=11"]').first().click()]);
              const target='official-evidence-80848/2026-17-original.pdf';
              await download.saveAs(target);
              const data=fs.readFileSync(target);
              if(!data.subarray(0,5).equals(Buffer.from('%PDF-'))||data.length<10000)throw new Error('DOWNLOADED_NOT_ORIGINAL_PDF');
              const receipt={notice_url:url,original_pdf_title:found[0].text,bytes:data.length,sha256:crypto.createHash('sha256').update(data).digest('hex'),checked_at:new Date().toISOString(),download_filename:download.suggestedFilename(),meta_posted:false,queue_updated:false};
              fs.writeFileSync('official-evidence-80848/receipt.json',JSON.stringify(receipt,null,2));
              console.log('ORIGINAL_PDF_EMPLOYER_RECEIPT='+JSON.stringify(receipt));
            }finally{await browser.close()}
          })().catch(e=>{console.error(String(e));process.exitCode=1});
          NODE
      - name: Independently extract original PDF text and enforce real unit 103 / whole 153
        shell: bash
        run: |
          python -m pip install --quiet pypdf
          python - <<'PY'
          import pathlib,json
          from pypdf import PdfReader
          p=pathlib.Path('official-evidence-80848/2026-17-original.pdf')
          reader=PdfReader(p)
          text='\\n'.join(page.extract_text() or '' for page in reader.pages)
          if not ('103' in text and '153' in text and '공무직' in text):
              raise SystemExit('UNIT_103_AND_TOTAL_153_NOT_SUPPORTED_BY_ORIGINAL')
          path=pathlib.Path('official-evidence-80848')
          (path/'original-text.txt').write_text(text)
          print('ORIGINAL_PDF_SEMANTIC_READ='+json.dumps({'pages':len(reader.pages),'chars':len(text),'103_present':True,'153_present':True}))
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-employer-2026-17-original
          path: official-evidence-80848/
          retention-days: 7
