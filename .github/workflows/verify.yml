name: Verify CareerPick restoration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_public_site.py
      - run: python -m unittest discover -s tests -p 'test_job_pages.py'
      - run: node --test tests/test_homepage_ux.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: careerpick-review-static
          path: dist
