name: Audit reachable history before public release
on:
  push:
    branches: [main]
    paths:
      - scripts/audit_public_history.py
      - tests/test_public_history_audit.py
      - .github/workflows/public-history-audit.yml
permissions:
  contents: read
concurrency:
  group: public-history-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify audit redaction and historical coverage
        run: python -m unittest discover -s tests -p test_public_history_audit.py
      - name: Audit every reachable Git blob without printing credentials
        env:
          ALIO_KEY: ${{ secrets.ALIO_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          GOJOBS_KEY: ${{ secrets.GOJOBS_KEY }}
          MPM_EXAM_KEY: ${{ secrets.MPM_EXAM_KEY }}
        run: python scripts/audit_public_history.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-history-audit-report
          path: public-history-audit-output/report.json
          retention-days: 7
          if-no-files-found: error
