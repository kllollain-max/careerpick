name: Verify a307061 exact official PDF and employer portal (read-only)
on:
  push:
    branches:
      - review/threads-a307061-official-20261118-1247
    paths:
      - .github/workflows/threads-a307061-source-proof.yml
      - scripts/threads_a307061_official_read.py
      - scripts/threads_a307061_profile_check.py
      - threads/independent-review/a307061-20261118-official-hold.json
permissions:
  contents: read
jobs:
  verify_original:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only official PDF text decoder
        run: python -m pip install --quiet requests beautifulsoup4 pymupdf
      - name: Fetch employer portal, official ALIO, government GOJOBS and original PDF; fail closed
        run: python scripts/threads_a307061_official_read.py
      - name: Independently render exact public job profile on mobile (read only)
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
          python scripts/threads_a307061_profile_check.py
      - name: Retain actual PDF bytes, text and SHA-256 receipt for independent review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: threads-a307061-official-primary-pdf-evidence
          path: official-reviewed-evidence/a307061/
          retention-days: 7
          if-no-files-found: warn
