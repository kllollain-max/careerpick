name: Verify targeted push recovery without sending
on:
  pull_request:
    paths: ['cleaneye.py', 'scripts/**', 'tests/test_alert*.py', 'tests/run_alert_recovery.py', '.github/workflows/targeted-push*.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/run_alert_recovery.py

