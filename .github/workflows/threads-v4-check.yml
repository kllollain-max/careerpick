name: Threads v4 isolated checks
on:
  push:
    branches:
      - rebuild/threads-v4-20261115
  pull_request:
    paths:
      - 'threads_v4/**'
      - '.github/workflows/threads-v4-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run isolated queue checks
        run: python -m unittest discover -s threads_v4 -p 'test_*.py' -v
      - name: Generate candidate review report from existing recruitment data
        run: |
          mkdir -p /tmp/threads-v4
          printf '{"schema_version":1,"entries":[]}' > /tmp/threads-v4/queue.json
          python -m threads_v4.candidate_report --queue /tmp/threads-v4/queue.json --output /tmp/threads-v4/candidates.json
          python -c 'import json; d=json.load(open("/tmp/threads-v4/candidates.json")); assert d["approved_count"] == 0; assert d["meta_posted"] is False'
      - name: Upload candidate review report
        uses: actions/upload-artifact@v4
        with:
          name: threads-v4-candidate-review
          path: /tmp/threads-v4/candidates.json
          retention-days: 7
      - name: Verify production publisher untouched
        run: |
          test -f .github/workflows/threads_auto.yml
          test -f threads_posted.json
          test -f alio.json
