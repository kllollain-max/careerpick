# Activated by owner instruction on 2026-11-03. Quota unverified: conservative three-hour cadence.
name: CareerPick scheduled operation
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: careerpick-pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record trigger and restore point
        run: |
          mkdir -p operations-output
          git rev-parse HEAD > operations-output/previous-head.txt
          echo "Trigger: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Collect and validate isolated candidate
        env:
          ALIO_KEY: ${{ secrets.ALIO_KEY }}
        run: python scripts/run_operations.py
      - name: Validate independent examination source
        id: exams
        continue-on-error: true
        env:
          MPM_EXAM_KEY: ${{ secrets.MPM_EXAM_KEY }}
        run: python scripts/run_exam_operations.py
      - name: Validate independent GOJOBS source
        id: gojobs
        continue-on-error: true
        env:
          GOJOBS_KEY: ${{ secrets.GOJOBS_KEY }}
        run: python scripts/collect_gojobs.py
      - name: Select validated data
        id: candidate
        run: |
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          report=json.loads(Path('operations-output/report.json').read_text())
          assert report['status'] in ('changed','unchanged') and report['originals_preserved']
          changed=report['changed']
          # End-of-day changes require a rebuild even when API content is unchanged.
          status=Path('operations-status.json')
          previous=json.loads(status.read_text()) if status.exists() else {}
          candidate_status=json.loads(Path('operations-output/candidate/operations-status.json').read_text())
          changed=changed or previous.get('counts',{}).get('archived')!=report['counts']['archived'] or previous.get('unconfirmed_ids')!=candidate_status['unconfirmed_ids']
          exam_report=Path('exam-operation-output/report.json')
          exam=json.loads(exam_report.read_text()) if exam_report.exists() else {}
          exam_ok=exam.get('status') in ('changed','unchanged')
          changed=changed or (exam_ok and (exam.get('changed') or not Path('exam-status.json').exists()))
          gojobs_report=Path('gojobs-operation-output/report.json')
          gojobs=json.loads(gojobs_report.read_text()) if gojobs_report.exists() else {}
          gojobs_ok=gojobs.get('status') in ('changed','unchanged')
          if gojobs_ok and gojobs.get('changed'):
              shutil.copyfile('gojobs-operation-output/gojobs.json','gojobs.json')
              changed=True
          if exam_ok and changed:
              shutil.copyfile('exam-operation-output/data/civil-service/2026.json','data/civil-service/2026.json')
              shutil.copyfile('exam-operation-output/exam-status.json','exam-status.json')
          if changed:
              for name in ('alio.json','alio-detail.json','operations-status.json'):
                  shutil.copyfile(Path('operations-output/candidate')/name,name)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('changed='+str(changed).lower()+'\n')
          PY
      - name: Build allowlisted public site
        if: steps.candidate.outputs.changed == 'true'
        run: python scripts/build_public_site.py
      - name: Store validated data with fast-forward protection
        id: storage
        if: steps.candidate.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add alio.json alio-detail.json operations-status.json data/civil-service/2026.json
          if test -f exam-status.json; then git add exam-status.json; fi
          if test -f gojobs.json; then git add gojobs.json; fi
          git commit -m 'Update validated public recruitment snapshots'
          git push origin HEAD:main
      - uses: actions/configure-pages@v5
        if: steps.candidate.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.candidate.outputs.changed == 'true'
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
        if: steps.candidate.outputs.changed == 'true'
      - name: Verify public snapshot hashes
        id: public_check
        if: success()
        run: python scripts/verify_public_version.py
      - name: Record unchanged or deployment result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          CHANGED: ${{ steps.candidate.outputs.changed }}
          DEPLOYMENT_OUTCOME: ${{ steps.deployment.outcome }}
          STORAGE_OUTCOME: ${{ steps.storage.outcome }}
          PUBLIC_OUTCOME: ${{ steps.public_check.outcome }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('operations-output/report.json')
          r=json.loads(p.read_text()) if p.exists() else {'status':'failed_before_collection'}
          r.update(trigger=os.environ['GITHUB_EVENT_NAME'],job_status=os.environ['JOB_STATUS'],deployment=os.environ['DEPLOYMENT_OUTCOME'] if os.environ['CHANGED']=='true' else ('unchanged' if os.environ['JOB_STATUS']=='success' else 'not_run_due_failure'),run_url=os.environ['GITHUB_SERVER_URL']+'/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID'])
          exam_path=Path('exam-operation-output/report.json')
          r['exam_source']=json.loads(exam_path.read_text()) if exam_path.exists() else {'status':'not_run'}
          gojobs_path=Path('gojobs-operation-output/report.json')
          r['gojobs_source']=json.loads(gojobs_path.read_text()) if gojobs_path.exists() else {'status':'not_run'}
          r['storage']=os.environ['STORAGE_OUTCOME'] if os.environ['CHANGED']=='true' else 'unchanged'
          r['public_check']=os.environ['PUBLIC_OUTCOME']
          r['overall']='success' if os.environ['JOB_STATUS']=='success' and r['exam_source'].get('status') in ('changed','unchanged') and r['gojobs_source'].get('status') in ('changed','unchanged') and r['gojobs_source'].get('official_page_failed',1)==0 else 'partial_or_failed'
          p.write_text(json.dumps(r,ensure_ascii=False,indent=2)+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('```json\n'+json.dumps(r,ensure_ascii=False,indent=2)+'\n```\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operation-${{ github.run_id }}
          path: |
            operations-output/report.json
            operations-output/previous-head.txt
            build-report.json
            exam-operation-output/report.json
            gojobs-operation-output/report.json
          retention-days: 30
