name: Threads 80848 real profile and employer receipt (read-only)
on:
  push:
    branches:
      - verify/threads-80848-live-check-20261117
    paths:
      - .github/workflows/threads-80848-approval-live-check.yml
      - threads/independent-review/cleaneye-80848-20261117-submission.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Read live CareerPick notice and exact employer application page without posting
        shell: bash
        run: |
          mkdir -p live-profile-evidence
          node - <<'NODE'
          const {chromium}=require('playwright');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const result={notice_id:'cleaneye-80848', checked_at:new Date().toISOString(), live_profile_status:'unverified'};
            try{
              const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
              const home='https://kllollain-max.github.io/careerpick/#job=cleaneye-80848';
              await page.goto(home,{waitUntil:'domcontentloaded',timeout:60000});
              try{
                await page.waitForFunction(()=>{
                  const p=document.querySelector('#jobview');
                  const b=document.querySelector('#jvBody');
                  return p && !p.hidden && b && /서울메트로환경/.test(b.innerText||'');
                },null,{timeout:90000});
              }catch(e){result.profile_wait_error=String(e).slice(0,400);}
              result.profile=await page.evaluate(()=>{
                const panel=document.querySelector('#jobview');
                const body=document.querySelector('#jvBody');
                const a=[...(body?.querySelectorAll('a[href]')||[])].map(x=>({label:(x.innerText||'').trim().slice(0,100),url:x.href}));
                return {panel_visible:!!panel&&!panel.hidden,body:(body?.innerText||'').slice(0,5000),links:a,hash:location.hash};
              });
              await page.screenshot({path:'live-profile-evidence/cleaneye-80848-profile.png'});
              const hasExact=(result.profile.links||[]).some(x=>/job\.cleaneye\.go\.kr/.test(x.url) && /80848/.test(x.url));
              const hasInstitution=(result.profile.body||'').includes('서울메트로환경');
              result.live_profile_status=result.profile.panel_visible&&hasInstitution&&hasExact?'verified':'failed_closed';
              const employer=await browser.newPage();
              await employer.goto('https://recruit.incruit.com/cleanmetro/job/2610280002',{waitUntil:'domcontentloaded',timeout:45000});
              result.employer=await employer.evaluate(()=>({url:location.href,title:document.title,body:document.body.innerText.slice(0,2500)}));
              await employer.screenshot({path:'live-profile-evidence/cleanmetro-application.png'});
              result.employer_status=/모집중/.test(result.employer.body)&&/11\.\s*20\.\s*12:00/.test(result.employer.body)?'verified':'incomplete';
              console.log('THREADS_80848_READ_ONLY_RECEIPT='+JSON.stringify(result));
              fs.writeFileSync('live-profile-evidence/receipt.json',JSON.stringify(result,null,2));
              if(result.live_profile_status!=='verified'||result.employer_status!=='verified')throw new Error('Profile or employer receipt incomplete; do not approve');
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'\nLive 80848 profile exact link and employer deadline verified; NOT an approval or Meta post.\n');
            }finally{await browser.close();}
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - name: Capture exact existing reviewed card assets and byte digests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p live-profile-evidence
          cp threads-images/cleaneye-80848.jpg live-profile-evidence/cleaneye-80848.jpg
          cp threads-images/cleaneye-80848-360.png live-profile-evidence/cleaneye-80848-360.png
          python - <<'PY'
          import hashlib, json, pathlib
          files=['cleaneye-80848.jpg','cleaneye-80848-360.png']
          out={}
          for name in files:
              b=(pathlib.Path('live-profile-evidence')/name).read_bytes()
              out[name]={'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()}
          pathlib.Path('live-profile-evidence/card-digests.json').write_text(json.dumps(out,indent=2)+'\\n')
          print('THREADS_80848_CARD_DIGESTS='+json.dumps(out))
          PY
      - name: Independently run full v5 validator, real-card pixels and original official bytes (no writes)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet Pillow
          python - <<'PY'
          import json, pathlib, traceback
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from scripts.threads_auto import writer_inputs, load
          from scripts.threads_writer_queue import validate_entry
          from scripts.threads_card_review import verify_reviewed_card
          from scripts.threads_reviewed_ingest import verify_official_receipt
          root=pathlib.Path.cwd()
          entry=json.loads((root/'threads/independent-review/cleaneye-80848-20261117-submission.json').read_text())['entries'][0]
          policy,source,details=writer_inputs(root)
          history=load(root/'threads_posted.json',{'records':[],'posted_ids':[]})
          now=datetime.now(ZoneInfo('Asia/Seoul'))
          report={'now':now.isoformat(),'notice_id':entry['notice_id'],'slot':entry['scheduled_at'],
                  'v5_validated':False,'card_pixels_verified':False,'official_receipt_verified':False,
                  'meta_posted':False,'queue_updated':False}
          try:
              selected=validate_entry(entry,datetime.fromisoformat(entry['scheduled_at']),now,history,source,details,policy)
              report['v5_validated']=True
              report['validated_image_job']=selected['image_job']
              pix=verify_reviewed_card(selected['image_job'],selected['writer_review'],root,now,verify_pixels=True)
              report['card_pixels_verified']=pix['pixel_verification']=='passed'
              report['card_verified_sha']=pix['sha256']
              rec=verify_official_receipt(entry)
              report['official_receipt_verified']=True
              report['source_count']=len(rec['verified_fact_sources'])
          except Exception as e:
              report['error']=str(e);report['error_type']=type(e).__name__
              traceback.print_exc()
              if str(e)=='OFFICIAL_SOURCE_BYTES_CHANGED':
                  from scripts.threads_reviewed_ingest import fetch_official_digest
                  checks=[]
                  for ref in entry['writer']['review']['source_refs']:
                      url=ref['url']
                      actual=[]
                      for repeat in (1,2):
                          try: actual.append(fetch_official_digest(url))
                          except Exception as err: actual.append(type(err).__name__+':'+str(err))
                      checks.append({'url':url,'original_sha256':ref.get('document_sha256'),
                                     'current_sha256_first':actual[0],
                                     'current_sha256_second':actual[1],
                                     'stable_two_reads':actual[0]==actual[1]})
                  report['source_drift_diagnostics']=checks
                  print('OFFICIAL_DRIFT_DIAGNOSTIC='+json.dumps(checks,ensure_ascii=False))
          finally:
              (root/'live-profile-evidence').mkdir(exist_ok=True)
              (root/'live-profile-evidence/strict-v5-validator.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\\n')
              print('STRICT_V5_REVIEW='+json.dumps(report,ensure_ascii=False))
          if not all(report[k] for k in ('v5_validated','card_pixels_verified','official_receipt_verified')):
              raise SystemExit('Hold unapproved: fail-closed strict publisher validation')
          PY
      - name: Preserve exact read-only browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: threads-80848-live-profile-evidence
          path: live-profile-evidence/
          retention-days: 7
