name: Threads 81143 official HWPX independent semantic check
on:
  push:
    branches:
      - review/threads-81143-official-semantic-20261118-0046
    paths:
      - .github/workflows/threads-81143-hwpx-independent.yml
permissions:
  contents: read
jobs:
  original:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet requests beautifulsoup4
      - name: Read employer-owned attachments, not rehashed API excerpts
        shell: bash
        run: |
          python - <<'PY'
          import datetime,hashlib,io,json,pathlib,re,urllib.parse,xml.etree.ElementTree as ET,zipfile
          from bs4 import BeautifulSoup
          import requests
          from zoneinfo import ZoneInfo
          base="https://www.gib.re.kr/module/bbs/view.php?bdno=1&mid=%2Fnews%2Fnotice&rdno=9136"
          alt="https://gib.re.kr/module/bbs/view.php?rdno=9136"
          out=pathlib.Path("official-81143");out.mkdir(exist_ok=True)
          sess=requests.Session();sess.headers.update({"User-Agent":"Mozilla/5.0 (compatible; OfficialIndependentReview/1.0)"})
          html=None;used=None;errs=[]
          for url in [base,alt]:
              try:
                  resp=sess.get(url,timeout=25);resp.raise_for_status()
                  if "2026년 제5차 직원채용 공고" not in resp.text:raise RuntimeError("WRONG_EMPLOYER_NOTICE")
                  html=resp.text;used=resp.url;break
              except Exception as e: errs.append(str(e)[:200])
          if html is None:raise RuntimeError("OFFICIAL_BOARD_NOT_RETRIEVED "+repr(errs))
          soup=BeautifulSoup(html,"html.parser")
          candidates=[]
          for a in soup.select("a"):
              txt=a.get_text(" ",strip=True)
              parent=a.parent.get_text(" ",strip=True)[:160] if a.parent else ""
              joined=(txt+" "+parent)
              if any(s in joined for s in ("채용 공고문.hwpx","직무수행요건 명세서.hwpx","직원채용 공고문")):
                  candidates.append({"text":txt,"href":a.get("href"),"onclick":a.get("onclick")})
          (out/"file-links.json").write_text(json.dumps({"official_board":used,"candidates":candidates},ensure_ascii=False,indent=2),encoding="utf-8")
          print("EXACT_EMPLOYER_ATTACHMENT_LINKS",json.dumps(candidates,ensure_ascii=False))
          reviewed=[]
          for candidate in candidates:
              href=candidate.get("href")
              if not href or href.startswith(("javascript:","#")):continue
              url=urllib.parse.urljoin(used,href)
              u=urllib.parse.urlsplit(url)
              if u.scheme!="https" or u.hostname not in ("gib.re.kr","www.gib.re.kr"):continue
              if len(reviewed)>=2:break
              resp=sess.get(url,timeout=30);resp.raise_for_status()
              raw=resp.content
              if not zipfile.is_zipfile(io.BytesIO(raw)):continue
              z=zipfile.ZipFile(io.BytesIO(raw))
              entries=[name for name in z.namelist() if re.search(r"Contents/section\d+\.xml$",name,re.I)]
              if not entries:continue
              sections=[]
              for name in entries:
                  xml=ET.fromstring(z.read(name))
                  blocks=[el.text.strip() for el in xml.iter() if el.text and el.text.strip()]
                  sections.append("\n".join(blocks))
              full="\n".join(sections)
              if len(full)<200:raise RuntimeError("HWPX_TEXT_TOO_SHORT")
              result={"url":url,"bytes":len(raw),"sha256":hashlib.sha256(raw).hexdigest(),
                      "sections":len(entries),"text_length":len(full),
                      "checked_at_kst":datetime.datetime.now(ZoneInfo("Asia/Seoul")).isoformat(),
                      "exact_original_read":True,"semantic_approval":False}
              (out/("attachment-"+str(len(reviewed)+1)+".hwpx")).write_bytes(raw)
              (out/("attachment-"+str(len(reviewed)+1)+".txt")).write_text(full,encoding="utf-8")
              reviewed.append(result)
              print("OFFICIAL_ORIGINAL_HWPX_REVIEW",json.dumps(result,ensure_ascii=False))
              print("ORIGINAL_TEXT_START",full[:14500])
          (out/"receipt.json").write_text(json.dumps({"board":used,"reviewed":reviewed,"manual_semantic_review_required":True,"approved_for_queue":False},ensure_ascii=False,indent=2),encoding="utf-8")
          if len(reviewed)<2:raise RuntimeError("OFFICIAL_EXACT_HWPX_ATTACHMENTS_NOT_READ")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: threads-81143-original-hwpx-attachments
          path: official-81143/
          retention-days: 20
