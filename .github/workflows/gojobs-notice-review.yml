name: Review GOJOBS notice eligibility offline
on:
  push:
    branches: [codex/gojobs-notice-guard-20261103]
    paths:
      - gojobs_notice_safety.py
      - tests/test_gojobs_notice_safety.py
      - scripts/review_gojobs_notices.py
      - tests/test_gojobs_notice_review.py
      - docs/evidence/gojobs-current-sample-20261103.json
      - .github/workflows/gojobs-notice-review.yml
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check notice classification and candidate gates
        run: |
          python -m unittest discover -s tests -p test_gojobs_notice_safety.py
          python -m unittest discover -s tests -p test_gojobs_notice_review.py
      - name: Review preserved API evidence without network or secrets
        run: python scripts/review_gojobs_notices.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gojobs-notice-review
          path: gojobs-notice-review-output/report.json
          retention-days: 7
          if-no-files-found: warn
