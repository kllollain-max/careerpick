name: Verify Threads migration without publishing
on:
  pull_request:
    paths:
      - 'scripts/threads_*.py'
      - 'scripts/threads_*.sh'
      - 'scripts/cleaneye_source_adapter.py'
      - 'scripts/create_thumbnail.py'
      - 'threads/**'
      - 'tests/test_threads_*.py'
      - 'threads_posted.json'
      - '.github/workflows/threads*.yml'
  workflow_dispatch:
    inputs:
      read_meta:
        description: Read official account and public posts; never publish
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact-card renderer dependencies
        run: bash scripts/threads_install_card_deps.sh
      - run: python -m unittest discover -s tests -p 'test_threads_*.py' -v
      - run: python -m unittest discover -s tests -p 'test_recovered_threads_*.py' -v
      - run: python scripts/threads_auto.py preview
      - name: Verify current writer inputs without creating a queue or publishing
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from scripts.threads_writer_input import build_input
          result = build_input(datetime.now(ZoneInfo('Asia/Seoul')), limit=24)
          candidates = result['candidates']
          assert len(candidates) <= 24
          assert len({row['notice_id'] for row in candidates}) == len(candidates)
          print(json.dumps({'candidate_count': len(candidates),
                            'sources': dict(Counter(row.get('source', 'alio') for row in candidates)),
                            'cleaneye_snapshot': result['cleaneye_source'],
                            'queue_writes': 0, 'published': 0}, ensure_ascii=False))
          PY
      - name: Read-only migration audit
        if: github.event_name == 'workflow_dispatch' && inputs.read_meta
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ENABLED: 'false'
          THREADS_EXPECTED_USERNAME: hid_119
        run: python scripts/threads_migration_audit.py
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch' && inputs.read_meta
        with:
          name: threads-migration-read-only-evidence
          path: threads-migration-audit.json
          if-no-files-found: ignore
