name: Verify Cleaneye employment API candidate
on:
  push:
    branches: [codex/cleaneye-api-20261107]
    paths:
      - cleaneye.py
      - cleaneye.json
      - scripts/collect_cleaneye.py
      - scripts/build_public_site.py
      - scripts/verify_cleaneye_browser.cjs
      - scripts/verify_cleaneye_fixture_browser.cjs
      - tests/test_cleaneye*.py
      - tests/test_cleaneye*.cjs
      - homepage-ux.js
      - homepage-ui.js
      - index.html
      - public-files.json
      - .github/workflows/cleaneye-api-check.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: careerpick-cleaneye-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate collection, source preservation and existing homepage behavior
        run: |
          python -m unittest discover -s tests -p 'test_cleaneye*.py'
          python -m unittest discover -s tests -p test_gojobs_collection.py
          python -m unittest discover -s tests -p test_operations.py
          node --test tests/test_cleaneye_ui.cjs tests/test_homepage_ux.cjs tests/test_record_migration.cjs tests/test_search_navigation.cjs
      - name: Build public site without collecting or changing source data
        run: python scripts/build_public_site.py
      - name: Install browser testing package
        timeout-minutes: 2
        run: npm install --no-save --no-package-lock --no-audit --no-fund --fetch-retries=1 --fetch-timeout=30000 playwright@1.56.1
      - name: Install browser and Korean fonts
        timeout-minutes: 5
        run: |
          if test -x /usr/bin/google-chrome; then
            printf 'CHROME_PATH=%s\n' /usr/bin/google-chrome >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify source filters, details and preserved records with in-memory fixtures
        run: node scripts/verify_cleaneye_fixture_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cleaneye-offline-check-${{ github.run_id }}
          path: |
            cleaneye-fixture-validation/
            build-report.json
          retention-days: 14
          if-no-files-found: error
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate the API client and preservation rules before protected requests
        run: python -m unittest discover -s tests -p 'test_cleaneye*.py'
      - name: Inspect the observed empty-region provider response
        env:
          CLEANEYE_KEY: ${{ secrets.CLEANEYE_KEY || secrets.DATA_GO_KR_KEY }}
        run: |
          python - <<'PY'
          import json, os, xml.etree.ElementTree as ET
          from datetime import datetime, timezone, timedelta
          import cleaneye
          client = cleaneye.Client(os.environ['CLEANEYE_KEY'])
          year = datetime.now(timezone(timedelta(hours=9))).year
          mapping = client.collect_region_codes(ac_year=year)
          region = '007005'
          if region not in mapping:
              raise RuntimeError('observed_region_not_in_verified_mapping')
          raw = client._fetch('list', {'sidoCd': region, 'type': 'xml'})
          try:
              client._envelope(raw, 'list')
          except cleaneye.APIError as exc:
              if exc.safe_code != 'api_result_3':
                  raise
          root = ET.fromstring(raw)
          for node in root.iter():
              node.tag = node.tag.rsplit('}', 1)[-1]
          header = root.find('header')
          if header is None:
              header = root.find('openXmlEmployInfo-header')
          body = root.find('body')
          if body is None:
              body = root.find('openXmlEmployInfo-body')
          evidence = {
              'probe': 'verified_region_no_data', 'region': region, 'year': year,
              'result_code': (header.findtext('resultCode') or '').strip(),
              'result_message': (header.findtext('resultMsg') or '').strip()[:256],
              'body_present': body is not None,
              'body_fields': [node.tag for node in body] if body is not None else [],
              'declared_counts': [(node.text or '').strip()[:16] for node in body.findall('totalCount')] if body is not None else [],
              'item_count': len(body.findall('.//item')) if body is not None else 0,
          }
          client._reject_credential_echo(evidence)
          print(json.dumps(evidence, ensure_ascii=False, sort_keys=True))
          PY
      - name: Collect approved API into isolated candidate
        env:
          CLEANEYE_KEY: ${{ secrets.CLEANEYE_KEY || secrets.DATA_GO_KR_KEY }}
        run: python scripts/collect_cleaneye.py
      - name: Build candidate in a separate checkout
        run: |
          git worktree add --detach "$RUNNER_TEMP/cleaneye-preview" HEAD
          cp cleaneye-operation-output/cleaneye.json "$RUNNER_TEMP/cleaneye-preview/cleaneye.json"
          cd "$RUNNER_TEMP/cleaneye-preview"
          python scripts/build_public_site.py
      - name: Install browser testing package
        timeout-minutes: 2
        run: npm install --no-save --no-package-lock --no-audit --no-fund --fetch-retries=1 --fetch-timeout=30000 playwright@1.56.1
      - name: Install browser and Korean fonts
        timeout-minutes: 5
        run: |
          if test -x /usr/bin/google-chrome; then
            printf 'CHROME_PATH=%s\n' /usr/bin/google-chrome >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify candidate cards, details and saved records at mobile and desktop widths
        env:
          CLEANEYE_PREVIEW_ROOT: ${{ runner.temp }}/cleaneye-preview
        run: |
          mkdir -p "$RUNNER_TEMP/cleaneye-http"
          ln -s "$RUNNER_TEMP/cleaneye-preview/dist" "$RUNNER_TEMP/cleaneye-http/careerpick"
          python -m http.server 8000 --directory "$RUNNER_TEMP/cleaneye-http" > "$RUNNER_TEMP/cleaneye-http.log" 2>&1 &
          node scripts/verify_cleaneye_browser.cjs
      - name: Record verification summary
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          report = Path('cleaneye-operation-output/report.json')
          if report.exists():
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write('## Cleaneye API candidate\n\n```json\n' + report.read_text() + '\n```\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cleaneye-api-candidate-${{ github.run_id }}
          path: |
            cleaneye-operation-output/report.json
            cleaneye-operation-output/cleaneye.json
            cleaneye-browser-validation/
            ${{ runner.temp }}/cleaneye-preview/build-report.json
          retention-days: 14
          if-no-files-found: error
